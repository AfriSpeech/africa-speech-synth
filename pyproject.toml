[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afrispeech-synth"
version = "0.1.0"
description = "Build synthetic speech datasets for African languages with Google Gemini TTS: corpus text, phoneme-coverage sentence selection, africa-g2p orthography normalisation, and a training-ready HuggingFace dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AfriSpeech" }]
keywords = ["tts", "gemini", "speech-synthesis", "african-languages", "dataset", "asr", "g2p"]

dependencies = [
    # 0.2.1 keeps the universal orthography to plain letters; earlier versions
    # wrote ejectives with apostrophes, which a TTS voice reads as pauses.
    "africa-g2p>=0.2.3",
    "PyYAML>=6.0",
    "pyarrow>=12.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# The Gemini TTS backend (the reference backend).
gemini = ["google-genai>=0.3.0"]
# Only the `hf:` text source needs datasets; parquet is written with pyarrow.
hf = ["datasets>=2.14"]
# afriso (language-name resolution) and africa-corpus-builder (source text) are
# not on PyPI, so they cannot be declared here — PyPI rejects direct URL
# dependencies, and an extra naming a package that does not exist would fail to
# install. Both are optional at runtime; the README gives the git install.
dev = ["pytest>=7.0"]

[project.scripts]
afrispeech-synth = "afrispeech_synth.cli:main"

[project.urls]
Homepage = "https://github.com/AfriSpeech/afrispeech-synth"
Issues = "https://github.com/AfriSpeech/afrispeech-synth/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/afrispeech_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
